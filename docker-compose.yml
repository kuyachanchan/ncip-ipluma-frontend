version: '3.8'

services:
  react-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: react-dev-container
    ports:
      - "3000:5173"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Preserve node_modules inside container
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true # For hot reload on some systems
    stdin_open: true
    tty: true

  react-app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-prod-container
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production